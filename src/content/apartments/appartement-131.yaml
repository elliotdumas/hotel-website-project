description:
  - fr: Séjour spacieux dans un appartement de 55 m² avec cuisine équipée, espace salon (canapé réversible pour 2 enfants) et coin salle à manger.
    en: A spacious 55 m² apartment with a fitted kitchen, a lounge area (sofa bed for 2 children) and a dining corner.
    de: Ein großzügiges 55-m²-Apartment mit Einbauküche, Wohnbereich (Schlafsofa für 2 Kinder) und Essecke.
  - fr: Chambre séparée avec lit double en 160/180 et linge fourni. Salle de bain avec douche, linge de bain et produits de toilette offerts.
    en: Separate bedroom with a 160/180 double bed and linen provided. Bathroom with shower, towels and complimentary toiletries.
    de: Separates Schlafzimmer mit Doppelbett 160/180 und Bettwäsche. Bad mit Dusche, Handtüchern und kostenlosen Pflegeprodukten.
