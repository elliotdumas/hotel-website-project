description:
  - fr: Nos Suites de 24 et 30 m² sont un havre de luxe et de sérénité. La décoration combine matériaux nobles et touches de design contemporain, autour d’un lit king-size de grande qualité, d’un mobilier sur mesure et d’un dressing spacieux.
    en: Our 24 and 30 m² Suites are a haven of luxury and serenity. The décor combines fine materials and contemporary design around a high-quality king-size bed, bespoke furniture and a spacious dressing area.
    de: Unsere Suiten mit 24 und 30 m² sind ein Refugium aus Luxus und Ruhe. Edle Materialien und zeitgenössisches Design umgeben ein hochwertiges Kingsize-Bett, maßgefertigte Möbel und einen großzügigen Ankleidebereich.
  - fr: Le salon attenant invite à la détente et la salle de bain, avec grande douche et baignoire, promet des moments de relaxation sublimés par des produits de toilette haut de gamme.
    en: The adjoining lounge invites you to unwind, and the bathroom, with a large shower and a bathtub, promises moments of relaxation with premium toiletries.
    de: Der angrenzende Wohnbereich lädt zum Entspannen ein, und das Bad mit großer Dusche und Badewanne verspricht Erholung mit hochwertigen Pflegeprodukten.
amenities: [tv, intlChannels, minibar, safe, kettle, coffee, ac, showerAndBath, seating, hairdryer]
