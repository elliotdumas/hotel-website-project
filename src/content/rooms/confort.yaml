# Chambre Confort — source : https://www.hotel-coulisses-du-theatre.com/nos-chambres/
order: 1
name:
  fr: Chambre Confort
  en: Comfort Room
  de: Komfort-Zimmer
tagline:
  fr: Le pied-à-terre idéal de vos escapades saint-quentinoises
  en: The ideal base for your getaways in Saint-Quentin
  de: Der ideale Ausgangspunkt für Ihre Ausflüge in Saint-Quentin
size: '12 à 15'
guests:
  fr: 1 à 2 personnes
  en: 1 to 2 guests
  de: 1 bis 2 Personen
bed:
  fr: Lit double (160 cm) ou lits jumeaux
  en: Double bed (160 cm) or twin beds
  de: Doppelbett (160 cm) oder zwei Einzelbetten
priceFrom: 89
description:
  - fr: D’une superficie de 12 à 15 m², la Chambre Confort dispose d’un lit de 160 cm de large et d’une salle de bain avec douche.
    en: Measuring 12 to 15 m², the Comfort Room features a 160 cm wide bed and a bathroom with shower.
    de: Das 12 bis 15 m² große Komfort-Zimmer verfügt über ein 160 cm breites Bett und ein Bad mit Dusche.
  - fr: Meubles créés sur mesure, décoration au style franco-marocain, coussins colorés et accessoires soigneusement sélectionnés pour une harmonie parfaite et une atmosphère chaleureuse.
    en: Bespoke furniture, Franco-Moroccan décor, colourful cushions and carefully chosen accessories create a harmonious, warm atmosphere.
    de: Maßgefertigte Möbel, französisch-marokkanisches Dekor, bunte Kissen und sorgfältig ausgewählte Accessoires sorgen für eine harmonische, warme Atmosphäre.
amenities: [tv, intlChannels, kettle, ac, shower, hairdryer]
noPets: true
