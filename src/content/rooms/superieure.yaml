description:
  - fr: D’une superficie de 16 à 20 m², la Chambre Supérieure vous offre un espace plus généreux pour vos séjours à Saint-Quentin, avec un lit de 160 cm, un agencement soigné et des équipements supplémentaires.
    en: At 16 to 20 m², the Superior Room offers more generous space for your stay in Saint-Quentin, with a 160 cm bed, a thoughtful layout and extra amenities.
    de: Mit 16 bis 20 m² bietet das Superior-Zimmer mehr Platz für Ihren Aufenthalt in Saint-Quentin, mit 160-cm-Bett, durchdachter Einrichtung und zusätzlicher Ausstattung.
  - fr: Selon les chambres, un canapé-lit peut accueillir un enfant, idéal pour les séjours en famille. Certaines chambres peuvent être communicantes pour vos séjours en groupe.
    en: Some rooms have a sofa bed for one child, ideal for families. Some rooms can also be connected for group stays.
    de: Einige Zimmer haben ein Schlafsofa für ein Kind, ideal für Familien. Manche Zimmer lassen sich für Gruppen miteinander verbinden.
amenities: [tv, intlChannels, accessible, kettle, coffee, ac, showerOrBath, sofaBed, hairdryer]
