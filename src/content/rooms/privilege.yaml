# Chambre Privilège — source : https://www.hotel-coulisses-du-theatre.com/nos-chambres/
order: 5
name:
  fr: Chambre Privilège
  en: Privilege Room
  de: Privilege-Zimmer
tagline:
  fr: Le summum du confort, spacieuse et lumineuse
  en: The height of comfort, spacious and bright
  de: Komfort auf höchstem Niveau, geräumig und hell
size: '21 à 25'
guests:
  fr: 2 personnes (+1 enfant en canapé-lit selon les chambres)
  en: 2 guests (+1 child on a sofa bed in some rooms)
  de: 2 Personen (+1 Kind auf dem Schlafsofa in einigen Zimmern)
bed:
  fr: Lit 180 × 200 cm
  en: 180 × 200 cm bed
  de: Bett 180 × 200 cm
priceFrom: 109
description:
  - fr: De 21 à 25 m², nos Chambres Privilège incarnent le summum du confort, avec un espace de vie spacieux et lumineux dans un cadre élégant. Vous y attend un lit de 180 × 200 cm, douillet grâce à notre linge français en coton et duvet de canard.
    en: At 21 to 25 m², our Privilege Rooms are the height of comfort, with a spacious, bright living area in an elegant setting. A 180 × 200 cm bed awaits you, made cosy with our French cotton linen and duck down.
    de: Mit 21 bis 25 m² bieten unsere Privilege-Zimmer höchsten Komfort mit einem geräumigen, hellen Wohnbereich in elegantem Ambiente. Sie erwartet ein 180 × 200 cm großes Bett mit französischer Baumwollwäsche und Entendaunen.
  - fr: Idéales pour une escapade romantique, un voyage d’affaires ou des vacances en famille, elles peuvent disposer d’un canapé-lit pour un enfant.
    en: Ideal for a romantic getaway, a business trip or a family holiday, they can include a sofa bed for one child.
    de: Ideal für eine romantische Auszeit, eine Geschäftsreise oder einen Familienurlaub; ein Schlafsofa für ein Kind ist möglich.
amenities:
  [tv, intlChannels, accessible, safe, kettle, coffee, ac, showerOrBath, sofaBed, hairdryer]
