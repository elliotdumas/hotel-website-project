description:
  - fr: Pensée pour offrir une expérience exclusive, la Chambre Rooftop allie un espace intérieur de 14 m² conçu pour l’essentiel du confort à une vaste terrasse rooftop, véritable petite oasis végétalisée.
    en: Designed as an exclusive experience, the Rooftop Room pairs a 14 m² interior with everything you need for comfort and a large rooftop terrace, a small green oasis.
    de: Das Rooftop-Zimmer ist als exklusives Erlebnis gedacht. Es verbindet 14 m² Innenraum mit allem Komfort und eine große Dachterrasse, eine kleine grüne Oase.
  - fr: Avec son salon de jardin et ses deux bains de soleil, c’est l’endroit idéal pour se prélasser au soleil ou admirer les étoiles. Idéale pour une escapade romantique ou un séjour en solo alliant sérénité et élégance.
    en: With its garden furniture and two sun loungers, it is the perfect spot to relax in the sun or gaze at the stars. Ideal for a romantic getaway or a calm, elegant solo stay.
    de: Mit Gartenmöbeln und zwei Sonnenliegen ist sie der perfekte Ort, um in der Sonne zu entspannen oder die Sterne zu betrachten. Ideal für eine romantische Auszeit oder einen ruhigen, eleganten Aufenthalt allein.
amenities: [tv, intlChannels, kettle, coffee, ac, shower, outdoorLounge, sunLoungers, hairdryer]
highlight:
  fr: Terrasse et balcon en rooftop
  en: Rooftop terrace and balcony
  de: Dachterrasse und Balkon
