description:
  - fr: Offrez-vous un séjour tout en confort et en quiétude dans notre Chambre Patio, élégante et dotée d’une terrasse privée de plain-pied. Sa surface intérieure de 17,5 à 20,5 m² allie bien-être et praticité.
    en: Enjoy a comfortable, peaceful stay in our elegant Patio Room with its private ground-floor terrace. Its 17.5 to 20.5 m² interior combines well-being and practicality.
    de: Genießen Sie einen komfortablen, ruhigen Aufenthalt in unserem eleganten Patio-Zimmer mit privater ebenerdiger Terrasse. Die 17,5 bis 20,5 m² Innenfläche verbinden Wohlbefinden und Praktikabilität.
  - fr: Son espace extérieur aménagé est idéal pour savourer un café matinal ou un moment de détente en fin de journée, une parenthèse paisible dans un cadre élégant et chaleureux.
    en: Its furnished outdoor area is perfect for a morning coffee or unwinding at the end of the day, a peaceful break in an elegant, warm setting.
    de: Der möblierte Außenbereich ist ideal für einen Morgenkaffee oder zum Entspannen am Abend, eine ruhige Auszeit in elegantem, warmem Ambiente.
amenities: [tv, intlChannels, safe, kettle, coffee, ac, showerOrBath, hairdryer]
